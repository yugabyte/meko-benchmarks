<text x="90.0" y="134.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">dataset</text>
<rect x="190" y="60" width="225" height="130" rx="6" fill="#f6f6f6" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="302.5" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">1 · ingest</text>
