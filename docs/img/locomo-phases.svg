<text x="302" y="129" text-anchor="middle" font-size="11.5" font-weight="400" fill="#555555">a Meko conversation per session</text>
<text x="302" y="146" text-anchor="middle" font-size="11.5" font-weight="400" fill="#555555">a message per speaker turn</text>
<text x="302" y="163" text-anchor="middle" font-size="11.5" font-weight="400" fill="#555555">backdated with session_date</text>
<rect x="445" y="100" width="105" height="50" rx="6" fill="#f6f6f6" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="497.5" y="118.0" text-anchor="middle" font-size="13" font-weight="500" fill="#1a1a1a">embed turns</text>
<text x="497.5" y="137.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#555555">vectors the DB lacks</text>
<rect x="580" y="60" width="180" height="130" rx="6" fill="#f6f6f6" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="670.0" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">2 · retrieve</text>
<text x="670" y="112" text-anchor="middle" font-size="11.5" font-weight="400" fill="#555555">context_search once</text>
<text x="670" y="129" text-anchor="middle" font-size="11.5" font-weight="400" fill="#555555">memory_search at each k</text>
<text x="670" y="146" text-anchor="middle" font-size="11.5" font-weight="400" fill="#555555">hits tagged with session</text>
<text x="670" y="163" text-anchor="middle" font-size="11.5" font-weight="400" fill="#555555" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→ retrieval.jsonl</text>
<rect x="790" y="60" width="160" height="130" rx="6" fill="#f6f6f6" stroke="#1a1a1a" stroke-width="1.2"/>
