<text x="870" y="112" text-anchor="middle" font-size="11.5" font-weight="400" fill="#555555">memories + turns in context</text>
<text x="870" y="129" text-anchor="middle" font-size="11.5" font-weight="400" fill="#555555">question date is today</text>
